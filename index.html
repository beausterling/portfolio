<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beau Sterling</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section id="landing-page">
    <nav>
      <figure>
        <img id="personal-logo" src="./assets/logo.svg" alt="Beau Sterling logo">
      </figure>
      <ul class="nav__link--list">
        <li class="nav__link">
          <a href="#" class="
            nav__link--anchor
            link__hover-effect
            link__hover-effect--black
          ">About</a>
        </li>
        <li class="nav__link">
          <a href="#projects" class="
            nav__link--anchor
            link__hover-effect
            link__hover-effect--black
          ">Projects</a>
        </li>
        <li class="nav__link">
          <a href="#" class="
            nav__link--anchor
            link__hover-effect
            link__hover-effect--black
          ">Contact</a>
        </li>
        <li class="nav__link">
          <a href="#" class="
            nav__link--anchor
            link__hover-effect
            link__hover-effect--black
          " aria-label="Toggle dark mode"><i class="fas fa-adjust"></i></a>
        </li>
      </ul>
    </nav>
    <header class="header">
      <div class="header__content">
        <h1 class="title">Hey</h1>
        <h2 class="title orange">I'm Beau.</h2>
        <p class="header__para">
          I'm learning <b class="orange">frontend development</b> and I love building websites that are clean,
          responsive and easy to use.
          <br>
          Here's a bit more <a href="#"><b class="orange click">about me</b></a>.
        </p>
        <div class="social__list">
          <a href="https://github.com/beausterling" target="_blank" class="social__link click" aria-label="My GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="#projects" class="social__link click" aria-label="See my projects">
            <i class="fas fa-laptop-code"></i>
          </a>
          <a href="#" class="social__link click" aria-label="Contact me">
            <i class="fas fa-envelope"></i>
          </a>
        </div>
      </div>
    </header>
    <button class="mail__btn click" aria-label="Open the contact form">
      <i class="fas fa-envelope"></i>
    </button>
    <a href="#projects" class="scroll" aria-label="Scroll down to my projects">
      <div class="scroll__icon click"></div>
    </a>
  </section>
</body>

</html>
